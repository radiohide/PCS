<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCScope</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app" data-theme="dark">
<header><div class="brand"><span class="brand-icon">▥</span> PCScope <small>开发版 0.2.39</small></div><div class="header-actions"><div class="refresh-switch-control"><span id="auto-refresh-label">自动刷新</span><button id="auto-refresh" class="refresh-switch" type="button" role="switch" aria-checked="true" aria-labelledby="auto-refresh-label" title="暂停刷新不会停止监控"><span id="auto-refresh-state" aria-hidden="true">开</span><span class="refresh-switch-thumb" aria-hidden="true"></span></button></div><button id="load-latest" type="button" title="显示最新结果">载入最新</button><button id="theme">切换浅色</button></div></header>
<div class="layout"><aside class="sidebar"><div class="eyebrow">本机监控</div><nav id="navigation"></nav><div class="sidebar-bottom"><span class="status-dot"></span> 本机历史<br><small>记录保存在本机</small></div></aside>
<main><div id="content"></div></main></div>
<section id="issues-panel" class="issues-panel" role="region" aria-labelledby="issues-title" hidden><div class="issues-heading"><h2 id="issues-title">需要处理</h2><button data-issues-close type="button" aria-label="收起异常列表">收起</button></div><div data-issues-list></div></section>
<footer><div class="runtime-state"><span id="operation" role="status" tabindex="-1">正在连接</span><progress id="progress" max="100" value="0" aria-label="当前采集进度" hidden></progress></div><button id="issues-toggle" type="button" aria-controls="issues-panel" aria-expanded="false" hidden></button></footer>
</div><script src="event-semantics.js"></script><script src="event-presentation.js"></script><script src="evidence-explanations.js"></script><script src="snapshot-diff.js"></script><script src="object-details.js"></script><script src="type-presentation-data.js"></script><script src="action-presentation-data.js"></script><script src="type-presentation.js"></script><script src="object-name-rules.js"></script><script src="object-names.js"></script><script src="readable-events.js"></script><script src="timeline-time.js"></script><script src="timeline-pages.js"></script><script src="model-view.js"></script><script src="auto-page.js"></script><script src="object-tree.js"></script><script src="timeline-window.js"></script><script src="timeline-groups.js"></script><script src="event-items.js"></script><script src="plugin-sources.js"></script><script src="plugin-manager.js"></script><script src="collection-view.js"></script><script src="monitoring.js"></script><script src="launch-settings.js"></script><script src="settings.js"></script><script src="backend-connection.js"></script><script src="query-queue.js"></script><script src="status-issues.js"></script><script src="state-compare.js"></script><script src="overview.js"></script><script src="app.js"></script></body></html>
