[workspace]
members = ["crates/contracts", "crates/storage", "crates/supervisor", "crates/ipc", "crates/service", "crates/cli", "plugins/simulator", "plugins/software", "plugins/powershell-adapter", "plugins/eventlog", "plugins/usn"]
resolver = "2"

[workspace.package]
version = "0.2.22"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "backup", "functions"] }
pcscope-contracts = { path = "crates/contracts" }
pcscope-storage = { path = "crates/storage" }
